parameters:
  # Frontend-Verwaltung: globale Upload-Standardwerte (Fallback, wenn das Feld in der DCA nichts festlegt).
  # Im Projekt überschreibbar (config/parameters.yaml bzw. parameters.yml). Pfade relativ zum Projekt,
  # müssen innerhalb von %contao.upload_path% liegen.
  catalog_manager.frontend_manager.upload_folder: '%contao.upload_path%/catalog-manager/uploads'
  catalog_manager.frontend_manager.home_folder: '%contao.upload_path%/catalog-manager/members'
  catalog_manager.frontend_manager.create_folders: true

services:
  _defaults:
    autowire: true
    autoconfigure: true

  contao.search.backend.virtual_table_data_container_provider:
    class: Alnv\ContaoCatalogManagerBundle\Search\Backend\Provider\VirtualTableDataContainerProvider
    arguments:
      - '@contao.framework'
      - '@database_connection'
      - '@event_dispatcher'
      - '@contao.data_container.dca_url_analyzer'
      - '@translator'
      - '@security.helper'

  Alnv\ContaoCatalogManagerBundle\Mcp\McpCommand:
    public: true

  Alnv\ContaoCatalogManagerBundle\Migration\InsertTagCaseMigration:
    tags: [ contao.migration ]

  Alnv\ContaoCatalogManagerBundle\Migration\ListingModuleTypeMigration:
    arguments:
      $projectDir: '%kernel.project_dir%'
    tags: [ contao.migration ]

  Alnv\ContaoCatalogManagerBundle\Pages\FilterPageController:
    tags: [ contao.page ]

  Alnv\ContaoCatalogManagerBundle\Controller\FrontendController:
    public: true
    arguments:
      $watchlistLimiter: '@catalogmanager.rate_limiter.watchlist'

  # Rate-Limits (gleiches Muster/Storage wie Contaos eigene Limiter)
  catalogmanager.rate_limiter.watchlist:
    class: Symfony\Component\RateLimiter\RateLimiterFactory
    public: true
    arguments:
      - { id: catalogmanager_watchlist, policy: sliding_window, limit: 30, interval: '1 minute' }
      - '@contao.rate_limit.storage'
      - '@?lock_factory'

  catalogmanager.rate_limiter.reactions:
    class: Symfony\Component\RateLimiter\RateLimiterFactory
    public: true
    arguments:
      - { id: catalogmanager_reactions, policy: sliding_window, limit: 20, interval: '1 minute' }
      - '@contao.rate_limit.storage'
      - '@?lock_factory'

  Alnv\ContaoCatalogManagerBundle\Controller\BackendOptionController:
    public: true

  # Insert-Tags active, active_page, master, watchlist, timestamp (#[AsInsertTag], per autoconfigure)
  Alnv\ContaoCatalogManagerBundle\Inserttags\CatalogInsertTagResolver: ~

  # Tags mit Bindestrich sind als Parser-Namen nicht erlaubt und bleiben beim Hook:
  # watchlist-table, watchlist-reset, watchlist-count bzw. cm-user, last-added-master-view-ids
  Alnv\ContaoCatalogManagerBundle\Inserttags\Inserttags:
    tags:
      - { name: contao.hook, hook: replaceInsertTags }

  Alnv\ContaoCatalogManagerBundle\Inserttags\WatchlistInsertTag:
    tags:
      - { name: contao.hook, hook: replaceInsertTags }

  Alnv\ContaoCatalogManagerBundle\EventListener\InitializeSystemListener:
    tags:
      - { name: contao.hook, hook: initializeSystem }

  Alnv\ContaoCatalogManagerBundle\EventListener\GenerateBreadcrumbListener:
    tags:
      - { name: contao.hook, hook: generateBreadcrumb }

  Alnv\ContaoCatalogManagerBundle\EventListener\GetSearchablePagesListener:
    tags:
      - { name: contao.hook, hook: getSearchablePages }

  Alnv\ContaoCatalogManagerBundle\EventListener\LoadDataContainerListener:
    tags:
      - { name: contao.hook, hook: loadDataContainer }

  Alnv\ContaoCatalogManagerBundle\EventListener\GetPageLayoutListener:
    tags:
      - { name: contao.hook, hook: getPageLayout }

  Alnv\ContaoCatalogManagerBundle\EventListener\GeneratePageListener:
    tags:
      - { name: contao.hook, hook: generatePage }

  Alnv\ContaoCatalogManagerBundle\EventListener\DoctrineSchemaListener:
    arguments:
      - '@contao.framework'
      - '@doctrine'
    tags:
      - { name: doctrine.event_listener, event: postGenerateSchema }

  Alnv\ContaoCatalogManagerBundle\EventListener\IsVisibleElementListener:
    tags:
      - { name: contao.hook, hook: isVisibleElement }

  Alnv\ContaoCatalogManagerBundle\EventListener\CompileFormFieldsListener:
    tags:
      - { name: contao.hook, hook: compileFormFields }

  Alnv\ContaoCatalogManagerBundle\EventListener\GetAttributesFromDcaListener:
    tags:
      - { name: contao.hook, hook: getAttributesFromDca }

  Alnv\ContaoCatalogManagerBundle\EventListener\LoadFormFieldListener:
    tags:
      - { name: contao.hook, hook: loadFormField }

  Alnv\ContaoCatalogManagerBundle\EventListener\MultilingualDataContainerListener:
    public: true

  Alnv\ContaoCatalogManagerBundle\EventListener\MultilingualCatalogListener:
    public: true

  Alnv\ContaoCatalogManagerBundle\EventListener\ChangelanguageNavigationListener:
    public: true

  catalogmanager.datacontainer.catalog:
    class: Alnv\ContaoCatalogManagerBundle\DataContainer\Catalog
    public: true

  catalogmanager.datacontainer.catalogfield:
    class: Alnv\ContaoCatalogManagerBundle\DataContainer\CatalogField
    public: true

  catalogmanager.datacontainer.catalogoption:
    class: Alnv\ContaoCatalogManagerBundle\DataContainer\CatalogOption
    public: true

  catalogmanager.datacontainer.catalogpalette:
    class: Alnv\ContaoCatalogManagerBundle\DataContainer\CatalogPalette
    public: true

  catalogmanager.datacontainer.module:
    class: Alnv\ContaoCatalogManagerBundle\DataContainer\Module
    public: true

  catalogmanager.listener.sitemap:
    class: Alnv\ContaoCatalogManagerBundle\EventListener\SitemapListener
    arguments:
      - '@contao.framework'